/*
 This module can inject build properties from a JSON file. Each property in the
 JSON file will be mapped to a build property using the key of that property.
 Property keys ending with _comment will be skipped.

 If a secretFile property exists and points to a valid JSON file that file will
 be automatically loaded. You can manually load a file using the loadProperties
 method.
*/
import groovy.json.JsonSlurper
import org.codehaus.groovy.runtime.MethodClosure

def loadGradleProperties(propertyFile) {
    if (!propertyFile?.exists()) {
        return
    }

    def props = new Properties()
    propertyFile.withInputStream { props.load(it) }
    props.each { key, value ->
        if (!project.hasProperty(key)) {
            project.ext.set(key.toString(), value)
        }
    }
}

def findSharedGradleProperties() {
    File currentDir = project.projectDir
    while (currentDir != null) {
        File candidate = new File(currentDir, "gradle/csc-common.properties")
        if (candidate.exists()) {
            return candidate
        }
        currentDir = currentDir.parentFile
    }
    return null
}

def sharedGradleProperties = findSharedGradleProperties()
if (sharedGradleProperties != null) {
    loadGradleProperties(sharedGradleProperties)
}

loadGradleProperties(project.file("gradle.properties"))

def configuredModVersion = project.findProperty("mod_version")?.toString()?.trim()
def modVersionBase = project.findProperty("mod_version_base")?.toString()?.trim()
def supportedCreateVersion = project.findProperty("supported_create_version")?.toString()?.trim()

if (!modVersionBase && configuredModVersion?.contains("-")) {
    def versionParts = configuredModVersion.split("-", 2)
    modVersionBase = versionParts[0]
    if (!project.hasProperty("mod_version_base")) {
        project.ext.set("mod_version_base", modVersionBase)
    }
    if (!supportedCreateVersion && versionParts.length > 1) {
        supportedCreateVersion = versionParts[1]
        if (!project.hasProperty("supported_create_version")) {
            project.ext.set("supported_create_version", supportedCreateVersion)
        }
    }
}

if (!configuredModVersion && modVersionBase && supportedCreateVersion) {
    project.ext.set("mod_version", "${modVersionBase}-${supportedCreateVersion}")
}

if (project.rootProject.hasProperty("secretFile")) {
    project.logger.lifecycle("Automatically loading properties from the secretFile")
    final def secretsFile = project.rootProject.file(project.rootProject.getProperty("secretFile"))

    if (secretsFile.exists() && secretsFile.name.endsWith(".json")) {
        loadProperties(secretsFile)
    }
}

def loadProperties(propertyFile) {
    if (propertyFile.exists()) {
        propertyFile.withReader {
            Object propMap = new JsonSlurper().parse it

            for (entry in propMap) {
                if (!entry.key.endsWith("_comment")) {
                    project.ext.set(entry.key, entry.value)
                }
            }

            project.logger.lifecycle("Successfully loaded " + propMap.size() + " properties")
            propMap.clear()
        }
    } else {
        project.logger.warn("The property file " + propertyFile.getName() + " could not be loaded. It does not exist.")
    }
}

ext {
    loadProperties = this.&loadProperties as MethodClosure
}
