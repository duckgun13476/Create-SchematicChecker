File current = project.projectDir
File migratedScript = null

while (current != null) {
    File candidate = new File(current, 'gradle/allwork/publishing.gradle')
    if (candidate.exists()) {
        migratedScript = candidate
        break
    }
    current = current.parentFile
}

if (migratedScript == null) {
    throw new GradleException("Unable to locate migrated allwork publishing script for project '${project.path}'")
}

apply from: migratedScript
