ext.requireBuildProperty = { String name ->
    def value = project.findProperty(name)
    if (value == null) {
        throw new GradleException("Missing build property '${name}' for project '${project.path}'")
    }
    return value.toString()
}

ext.readCscDisplayVersion = {
    def cscDisplayVersion = project.findProperty("mod_version_base")?.toString()
    if (cscDisplayVersion == null) {
        cscDisplayVersion = requireBuildProperty('mod_version').split("-", 2)[0]
    }
    return cscDisplayVersion
}

def commonJavaDir = rootProject.file('common/src/main/java')
def commonResourcesDir = rootProject.file('common/src/main/resources')

sourceSets {
    main {
        java.srcDir(commonJavaDir)
        resources.srcDir(commonResourcesDir)
    }
}

tasks.named('processResources').configure {
    def cscBuildInfoProperties = [
            minecraft_version: requireBuildProperty('minecraft_version'),
            csc_version      : readCscDisplayVersion()
    ]

    inputs.properties(cscBuildInfoProperties)

    filesMatching('createschematicchecker-build.properties') {
        expand(cscBuildInfoProperties)
    }
}
