ext.requireBuildProperty = { String name ->
    def value = project.findProperty(name)
    if (value == null) {
        throw new GradleException("Missing build property '${name}' for project '${project.path}'")
    }
    return value.toString()
}

ext.readCscDisplayVersion = {
    def cscDisplayVersion = project.findProperty("mod_version_base")?.toString()
    if (cscDisplayVersion == null) {
        cscDisplayVersion = requireBuildProperty('mod_version').split("-", 2)[0]
    }
    return cscDisplayVersion
}

def commonJavaDir = rootProject.file('common/src/main/java')
def commonResourcesDir = rootProject.file('common/src/main/resources')
def commonBuildInfoResource = new File(commonResourcesDir, 'createschematicchecker-build.properties')
def generatedBuildInfoResourcesDir = layout.buildDirectory.dir('generated/csc-build-info-resources')
def cscBuildInfoProperties = [
        minecraft_version: requireBuildProperty('minecraft_version'),
        csc_version      : readCscDisplayVersion()
]

def generateCscBuildInfoResources = tasks.register('generateCscBuildInfoResources') {
    inputs.file(commonBuildInfoResource)
    inputs.properties(cscBuildInfoProperties)
    outputs.dir(generatedBuildInfoResourcesDir)

    doLast {
        def outputFile = new File(generatedBuildInfoResourcesDir.get().asFile, 'createschematicchecker-build.properties')
        outputFile.parentFile.mkdirs()
        outputFile.setText(new groovy.text.SimpleTemplateEngine()
                .createTemplate(commonBuildInfoResource.getText('UTF-8'))
                .make(cscBuildInfoProperties)
                .toString(), 'UTF-8')
    }
}

sourceSets {
    main {
        java.srcDir(commonJavaDir)
    }
}

tasks.named('processResources').configure {
    dependsOn(generateCscBuildInfoResources)

    from(commonResourcesDir) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        exclude 'createschematicchecker-build.properties'
        // Modern packet guards are registered only by targets that ship their
        // matching mixin classes. Let a target-owned mixin config replace this
        // shared default instead of packaging a class name it cannot load.
        if (new File(project.projectDir, 'src/main/resources/createschematicchecker.mixins.json').exists()) {
            exclude 'createschematicchecker.mixins.json'
        }
    }

    from(generatedBuildInfoResourcesDir)
}
