import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.net.HttpURLConnection
import java.net.URI
import java.net.URLEncoder

ext.readPublishingProperties = {
    def propertiesFile = rootProject.file('api.properties')
    if (!propertiesFile.exists()) {
        return null
    }

    def properties = new Properties()
    properties.load(new FileInputStream(propertiesFile))
    return properties
}

ext.readVersionParts = {
    def baseVersion = project.findProperty("mod_version_base")?.toString()
    def createVersion = project.findProperty("supported_create_version")?.toString()
    if (baseVersion != null && createVersion != null) {
        return [baseVersion, createVersion]
    }
    return mod_version.split("-", 2)
}

ext.readPrimaryChangelog = {
    return rootProject.file("update/changelog.md").text.split("\n\n\n")[0]
}

ext.readFullChangelog = {
    return rootProject.file("update/changelog.md").text
}

ext.readStringListProperty = { String name, List<String> defaultValue = [] ->
    def value = project.findProperty(name)
    if (value == null) {
        return defaultValue
    }
    if (value instanceof Collection) {
        return value.collect { it.toString().trim() }.findAll { !it.isEmpty() }
    }
    return value.toString()
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
}

ext.readPublishArtifactTaskName = {
    return project.findProperty('csc_publish_artifact_task_name')?.toString()?.trim() ?: 'jar'
}

ext.readPublishLoaderId = {
    return project.findProperty('csc_publish_loader_id')?.toString()?.trim() ?: ''
}

ext.readPublishDisplaySuffix = {
    def configuredSuffix = project.findProperty('csc_publish_display_suffix')?.toString()?.trim()
    if (configuredSuffix != null && !configuredSuffix.isEmpty()) {
        return configuredSuffix.startsWith('_') ? configuredSuffix : "_${configuredSuffix}"
    }

    def loaderId = readPublishLoaderId()
    return loaderId ? "_${loaderId}" : ''
}

ext.readPublishVersionSuffix = {
    def configuredSuffix = project.findProperty('csc_publish_version_suffix')?.toString()?.trim()
    if (configuredSuffix != null && !configuredSuffix.isEmpty()) {
        return configuredSuffix.startsWith('-') ? configuredSuffix : "-${configuredSuffix}"
    }

    def loaderId = readPublishLoaderId()
    return loaderId ? "-${loaderId}" : ''
}

ext.readPublishDisplayName = {
    def versionParts = readVersionParts()
    return "${display_name}_v${versionParts[0]}_for_Create_v${versionParts[1]}${readPublishDisplaySuffix()}"
}

ext.readPublishVersionId = {
    return "${minecraft_version}-${mod_version}${readPublishVersionSuffix()}"
}

ext.readPublishCurseForgeLoaders = {
    return readStringListProperty('csc_publish_curseforge_loaders')
}

ext.readPublishModrinthLoaders = {
    return readStringListProperty('csc_publish_modrinth_loaders')
}

ext.readPublishRequiredDependencies = {
    return readStringListProperty('csc_publish_required_dependencies', ['create'])
}

ext.readPublishOptionalDependencies = {
    return readStringListProperty('csc_publish_optional_dependencies', ['jei', 'observable'])
}

ext.readPublishArtifactFile = {
    def relativePath = project.findProperty('csc_publish_artifact_relative_path')?.toString()?.trim()
    if (relativePath != null && !relativePath.isEmpty()) {
        return project.file(relativePath)
    }

    def artifactTask = tasks.named(readPublishArtifactTaskName()).get()
    if (!artifactTask.hasProperty('archiveFile')) {
        throw new GradleException("Publishing task '${artifactTask.name}' does not expose archiveFile in project '${project.path}'")
    }
    return artifactTask.archiveFile.get().asFile
}

// Remote idempotency checks.  Publishing tasks declare no Gradle outputs, so
// Gradle itself cannot tell whether a release has already been uploaded.
ext.cscReadBooleanProperty = { String name, boolean defaultValue = false ->
    def value = project.findProperty(name)
    if (value == null) return defaultValue
    value.toString().trim().toLowerCase(Locale.ROOT) in ['1', 'true', 'yes', 'y', 'on']
}
ext.cscPublishForce = { cscReadBooleanProperty('csc_publish_force', false) }
ext.cscUrlEncode = { String value -> URLEncoder.encode(value, 'UTF-8') }
ext.cscHttpGetJson = { String url, Map<String, String> headers = [:], boolean notFoundAsNull = false ->
    HttpURLConnection connection = (HttpURLConnection) URI.create(url).toURL().openConnection()
    connection.requestMethod = 'GET'
    connection.connectTimeout = 20000
    connection.readTimeout = 20000
    connection.setRequestProperty('Accept', 'application/json')
    connection.setRequestProperty('User-Agent', 'Create-SchematicChecker-publish-check')
    headers.each { key, value -> if (value != null && !value.trim().isEmpty()) connection.setRequestProperty(key, value) }
    int code = connection.responseCode
    InputStream stream = code >= 400 ? connection.errorStream : connection.inputStream
    String body = stream == null ? '' : stream.getText('UTF-8')
    if (code == 404 && notFoundAsNull) return null
    if (code < 200 || code >= 300) throw new GradleException("Publishing remote check failed for ${project.path}: GET ${url} returned HTTP ${code}")
    body.trim().isEmpty() ? null : new JsonSlurper().parseText(body)
}
ext.cscCurseForgeHeaders = {
    def properties = readPublishingProperties()
    String key = properties?.getProperty('CF_CORE_API_KEY') ?: properties?.getProperty('CF_API_KEY') ?: properties?.getProperty('CURSEFORGE_API_KEY') ?: properties?.getProperty('CF_TOKEN')
    if (key == null || key.trim().isEmpty()) return [:]
    key.trim().startsWith('cfc_pat_') ? ['Authorization': "Key ${key.trim()}"] : ['x-api-key': key.trim()]
}
ext.cscPublishRemoteStatus = [:]
ext.cscPublishLedgerFile = { rootProject.file('update/publish-ledger.json') }
ext.cscCurseForgeLedgerMatch = {
    File ledgerFile = cscPublishLedgerFile()
    if (!ledgerFile.isFile()) return false
    try {
        def ledger = new JsonSlurper().parseText(ledgerFile.getText('UTF-8').replaceFirst('^\\uFEFF', ''))
        return (ledger.entries ?: ledger ?: []).any { entry ->
            entry instanceof Map && entry.platform == 'curseforge' && entry.status == 'success'
                    && entry.minecraftVersion == minecraft_version.toString()
                    && entry.loader == readPublishLoaderId() && entry.versionId == readPublishVersionId()
                    && entry.artifactFileName == readPublishArtifactFile().name
        }
    } catch (Throwable ignored) { return false }
}
ext.cscRecordCurseForgePublish = {
    File ledgerFile = cscPublishLedgerFile()
    List entries = []
    if (ledgerFile.isFile()) {
        try { def parsed = new JsonSlurper().parseText(ledgerFile.getText('UTF-8').replaceFirst('^\\uFEFF', '')); entries.addAll((parsed.entries ?: parsed ?: []) as Collection) } catch (Throwable ignored) { }
    }
    Map entry = [platform: 'curseforge', status: 'success', minecraftVersion: minecraft_version.toString(), loader: readPublishLoaderId(), versionId: readPublishVersionId(), artifactFileName: readPublishArtifactFile().name, confirmedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX")]
    entries.removeAll { existing -> existing instanceof Map && existing.platform == entry.platform && existing.minecraftVersion == entry.minecraftVersion && existing.loader == entry.loader && existing.versionId == entry.versionId }
    entries.add(entry)
    ledgerFile.parentFile.mkdirs()
    ledgerFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson([schemaVersion: 1, entries: entries])) + System.lineSeparator(), 'UTF-8')
}
ext.cscCheckCurseForgePublished = {
    if (cscPublishForce()) return false
    if (cscCurseForgeLedgerMatch()) { cscPublishRemoteStatus.curseforgeExists = true; return true }
    if (cscCurseForgeHeaders().isEmpty()) return false
    Map<String, Integer> loaderIds = ['forge': 1, 'fabric': 4, 'quilt': 5, 'neoforge': 6]
    List<Integer> loaders = readPublishCurseForgeLoaders().collect { loaderIds[it.toString().toLowerCase(Locale.ROOT)] }.findAll { it != null }.unique()
    String expectedName = readPublishDisplayName()
    String expectedFile = readPublishArtifactFile().name
    try {
        boolean found = loaders.any { loader ->
            def response = cscHttpGetJson("https://api.curseforge.com/v1/mods/${cscUrlEncode(curseforge_id.toString())}/files?gameVersion=${cscUrlEncode(minecraft_version.toString())}&modLoaderType=${loader}&pageSize=50", cscCurseForgeHeaders())
            (response?.data ?: []).any { file ->
                (file.displayName?.toString() == expectedName || file.fileName?.toString() == expectedFile) && (file.gameVersions ?: []).collect { it.toString() }.contains(minecraft_version.toString())
            }
        }
        cscPublishRemoteStatus.curseforgeExists = found
        return found
    } catch (Throwable error) {
        logger.warn("CurseForge publish check unavailable for ${project.path}; upload will be attempted: ${error.message}")
        cscPublishRemoteStatus.curseforgeExists = false
        return false
    }
}
ext.cscCheckModrinthPublished = {
    if (cscPublishForce()) return false
    String versionId = readPublishVersionId()
    try {
        def version = cscHttpGetJson("https://api.modrinth.com/v2/project/${cscUrlEncode(modrinth_id.toString())}/version/${cscUrlEncode(versionId)}", [:], true)
        boolean found = version instanceof Map && version.version_number?.toString() == versionId && (version.game_versions ?: []).collect { it.toString() }.contains(minecraft_version.toString()) && !Collections.disjoint((version.loaders ?: []).collect { it.toString() }, readPublishModrinthLoaders())
        cscPublishRemoteStatus.modrinthExists = found
        return found
    } catch (Throwable error) {
        logger.warn("Modrinth publish check unavailable for ${project.path}; upload will be attempted: ${error.message}")
        cscPublishRemoteStatus.modrinthExists = false
        return false
    }
}

// curseforgegradle fetches its version table before every upload.  Its legacy
// TLS client now fails that request on this project, so submit the documented
// legacy multipart payload ourselves with the version IDs resolved once.
ext.cscReadCurseForgeGameVersionIds = {
    Map<String, Long> minecraftIds = [
            '1.15.2': 7722L, '1.16.5': 8203L, '1.17.1': 8516L,
            '1.18.2': 9008L, '1.19.2': 9366L, '1.20.1': 9990L,
            '1.21.1': 11779L
    ]
    Map<String, Long> loaderIds = [forge: 7498L, fabric: 7499L, quilt: 9153L, neoforge: 10150L]
    Long minecraftId = minecraftIds[minecraft_version.toString()]
    if (minecraftId == null) throw new GradleException("No CurseForge legacy version ID is configured for Minecraft ${minecraft_version} in ${project.path}")
    List<Long> ids = [minecraftId, 9638L, 9639L]
    readPublishCurseForgeLoaders().each { loaderName ->
        Long loaderId = loaderIds[loaderName.toString().toLowerCase(Locale.ROOT)]
        if (loaderId == null) throw new GradleException("No CurseForge legacy loader ID is configured for '${loaderName}' in ${project.path}")
        ids.add(loaderId)
    }
    ids.unique()
}
ext.cscReadCurseForgeUploadMetadata = {
    Map<String, String> relationTypes = [:]
    readPublishRequiredDependencies().each { relationTypes[it] = 'requiredDependency' }
    readPublishOptionalDependencies().each { relationTypes.putIfAbsent(it, 'optionalDependency') }
    List<Map<String, String>> relations = relationTypes.collect { slug, relationType -> [slug: slug, type: relationType] }
    Map metadata = [
            changelog    : readPrimaryChangelog(),
            changelogType: 'markdown',
            displayName  : readPublishDisplayName(),
            releaseType  : publish_version.toString(),
            gameVersions : cscReadCurseForgeGameVersionIds()
    ]
    if (!relations.isEmpty()) metadata.relations = [projects: relations]
    metadata
}
ext.cscWriteMultipartTextPart = { OutputStream output, String boundary, String name, String value ->
    output.write(("--${boundary}\r\nContent-Disposition: form-data; name=\"${name}\"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${value}\r\n").getBytes('UTF-8'))
}
ext.cscWriteMultipartFilePart = { OutputStream output, String boundary, File file ->
    output.write(("--${boundary}\r\nContent-Disposition: form-data; name=\"file\"; filename=\"${file.name}\"\r\nContent-Type: application/java-archive\r\n\r\n").getBytes('UTF-8'))
    file.withInputStream { input -> input.transferTo(output) }
    output.write('\r\n'.getBytes('UTF-8'))
}
ext.cscUploadCurseForgeFile = {
    def properties = readPublishingProperties()
    String token = properties?.getProperty('CF_TOKEN')?.trim()
    if (token == null || token.isEmpty()) throw new GradleException("CF_TOKEN is required to publish ${project.path} to CurseForge")
    File artifact = readPublishArtifactFile()
    if (!artifact.isFile() || artifact.length() == 0L) throw new GradleException("CurseForge artifact is missing or empty: ${artifact}")
    String endpoint = project.findProperty('csc_publish_curseforge_upload_endpoint')?.toString()?.trim() ?: 'https://minecraft.curseforge.com'
    String url = "${endpoint.replaceFirst('/+$', '')}/api/projects/${cscUrlEncode(curseforge_id.toString())}/upload-file"
    int maxHandshakeAttempts = Math.max(1, (project.findProperty('csc_publish_curseforge_handshake_attempts')?.toString()?.toInteger() ?: 3))
    for (int attempt = 1; attempt <= maxHandshakeAttempts; attempt++) {
        String boundary = "----CreateSchematicChecker${UUID.randomUUID().toString().replace('-', '')}"
        HttpURLConnection connection = (HttpURLConnection) URI.create(url).toURL().openConnection()
        connection.requestMethod = 'POST'
        connection.doOutput = true
        connection.connectTimeout = 30000
        connection.readTimeout = 120000
        connection.setRequestProperty('Accept', 'application/json')
        connection.setRequestProperty('User-Agent', 'Create-SchematicChecker-publisher')
        connection.setRequestProperty('X-Api-Token', token)
        connection.setRequestProperty('Content-Type', "multipart/form-data; boundary=${boundary}")
        try {
            connection.outputStream.withCloseable { output ->
                cscWriteMultipartTextPart(output, boundary, 'metadata', JsonOutput.toJson(cscReadCurseForgeUploadMetadata()))
                cscWriteMultipartFilePart(output, boundary, artifact)
                output.write(("--${boundary}--\r\n").getBytes('UTF-8'))
            }
            int code = connection.responseCode
            InputStream stream = code >= 400 ? connection.errorStream : connection.inputStream
            String body = stream == null ? '' : stream.getText('UTF-8')
            if (code < 200 || code >= 300) throw new GradleException("CurseForge upload failed for ${project.path}: HTTP ${code}${body.trim().isEmpty() ? '' : " - ${body.take(1000)}"}")
            return body.trim().isEmpty() ? [:] : new JsonSlurper().parseText(body)
        } catch (Throwable error) {
            boolean handshakeFailure = false
            for (Throwable cause = error; cause != null; cause = cause.cause) {
                if (cause instanceof javax.net.ssl.SSLHandshakeException) {
                    handshakeFailure = true
                    break
                }
            }
            if (!handshakeFailure || attempt >= maxHandshakeAttempts) throw error
            logger.warn("CurseForge TLS handshake failed for ${project.path}; retrying upload (${attempt}/${maxHandshakeAttempts}): ${error.message}")
            Thread.sleep(1500L * attempt)
        } finally {
            connection.disconnect()
        }
    }
    throw new GradleException("CurseForge upload exhausted TLS handshake retries for ${project.path}")
}

tasks.register('PublishInfo') {
    group = 'Publishing'

    doLast {
        println "Publish artifact path: ${readPublishArtifactFile().absolutePath}"
        println "version = \"${readPublishVersionId()}\"\n" +
                "    displayName = \"${readPublishDisplayName()}\""
        def properties = readPublishingProperties()
        if (properties != null) {
            def cfToken = properties.getProperty("CF_TOKEN")
            def modrinthToken = properties.getProperty("MODRINTH_TOKEN")

            println "CF_TOKEN: ${cfToken ? 'present' : 'missing'}"
            println "MODRINTH_TOKEN: ${modrinthToken ? 'present' : 'missing'}"
        } else {
            println "api.properties not exist"
        }
    }
}

tasks.register('publishInfo') {
    group = 'Publishing'
    description = 'Alias for PublishInfo.'
    dependsOn 'PublishInfo'
}

tasks.register('publishAll') {
    dependsOn 'publishCurseForge'
    dependsOn 'publishMods'
    group = 'Publishing'
}

tasks.register('checkPublishRemoteStatus') {
    group = 'Publishing'
    description = 'Checks CurseForge and Modrinth for this target before uploading.'
    doLast {
        println "CurseForge target ${cscCheckCurseForgePublished() ? 'exists; will skip' : 'is absent; will upload'}: ${project.path}"
        println "Modrinth target ${cscCheckModrinthPublished() ? 'exists; will skip' : 'is absent; will upload'}: ${project.path}"
    }
}

tasks.register('allworkPublishInfo') {
    group = 'Allwork'
    description = 'Allwork alias for PublishInfo.'
    dependsOn 'PublishInfo'
}

tasks.register('allworkPublishAll') {
    group = 'Allwork'
    description = 'Allwork alias for publishAll.'
    dependsOn 'publishAll'
}

tasks.register('allworkJarJar') {
    group = 'Allwork'
    description = 'Allwork alias for the configured final publish artifact task.'
    dependsOn readPublishArtifactTaskName()
}

tasks.register('publishCurseForge') {
    dependsOn readPublishArtifactTaskName()
    group = 'Publishing'
    description = 'Uploads through CurseForge legacy multipart API without curseforgegradle version discovery.'
    onlyIf {
        boolean exists = cscPublishRemoteStatus.containsKey('curseforgeExists') ? cscPublishRemoteStatus.curseforgeExists : cscCheckCurseForgePublished()
        if (exists) println "Skipping CurseForge upload for ${project.path}: matching remote target already exists. Use -Pcsc_publish_force=true to override."
        !exists
    }
    doLast {
        def response = cscUploadCurseForgeFile()
        cscRecordCurseForgePublish()
        println "Uploaded CurseForge target for ${project.path}${response instanceof Map && response.id != null ? ": file ${response.id}" : ''}"
    }
}

publishMods {
    def properties = readPublishingProperties()
    def modrinthTokenGet = properties?.getProperty("MODRINTH_TOKEN")

    file = readPublishArtifactFile()
    changelog = readFullChangelog()
    type = STABLE
    version = readPublishVersionId()
    displayName = readPublishDisplayName()

    readPublishModrinthLoaders().each { loaderName ->
        modLoaders.add(loaderName)
    }

    var mrToken = modrinthTokenGet
    if (mrToken != null) {
        modrinth {
            accessToken = mrToken
            projectId = "${modrinth_id}"
            minecraftVersions.add(minecraft_version)
            readPublishRequiredDependencies().each { dependencyId ->
                requires(dependencyId)
            }
            readPublishOptionalDependencies().each { dependencyId ->
                optional(dependencyId)
            }
        }
    }
}

tasks.matching { it.name in ['publishMods', 'publishModrinth'] }.configureEach {
    dependsOn readPublishArtifactTaskName()
    onlyIf {
        boolean exists = cscPublishRemoteStatus.containsKey('modrinthExists') ? cscPublishRemoteStatus.modrinthExists : cscCheckModrinthPublished()
        if (exists) println "Skipping Modrinth upload for ${project.path}: matching remote target already exists. Use -Pcsc_publish_force=true to override."
        !exists
    }
}

tasks.register('runPython', Exec) {
    commandLine 'publishing/.venv/Scripts/python', 'publishing/get.py'
    doFirst {
        println "script publishing..."
    }
}
