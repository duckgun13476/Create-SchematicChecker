def allworkArtifactTaskName = {
    project.findProperty('csc_publish_artifact_task_name')?.toString()?.trim() ?: 'jar'
}

def allworkPublishInfoMessage = project.findProperty('csc_allwork_publish_info_message')?.toString()?.trim() ?:
        'Publishing metadata is only available from the repository root build.'

tasks.register('PublishInfo') {
    group = 'Publishing'
    doLast {
        println allworkPublishInfoMessage
    }
}

tasks.register('publishInfo') {
    group = 'Publishing'
    description = 'Alias for PublishInfo.'
    dependsOn 'PublishInfo'
}

tasks.register('publishAll') {
    group = 'Publishing'
}

tasks.register('allworkPublishInfo') {
    group = 'Allwork'
    description = 'Allwork alias for PublishInfo.'
    dependsOn 'PublishInfo'
}

tasks.register('allworkPublishAll') {
    group = 'Allwork'
    description = 'Allwork alias for publishAll.'
    dependsOn 'publishAll'
}

tasks.register('allworkJarJar') {
    group = 'Allwork'
    description = 'Allwork alias for the configured final publish artifact task.'
    dependsOn allworkArtifactTaskName()
}
