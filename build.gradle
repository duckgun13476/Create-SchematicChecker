plugins {
    id 'idea'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.2'
    id 'fabric-loom' version '1.10.5' apply false
}

allprojects {
    repositories {
        maven {
            name = "PinkCatsLocal"
            url = uri("C:/F/Maven")
        }
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

tasks.register('publishInfoAllVersions') {
    group = 'Publishing'
    dependsOn ':global:publishInfoAllVersions'
}

tasks.register('publishAllVersions') {
    group = 'Publishing'
    dependsOn ':global:publishAllVersions'
}

tasks.register('packageAllVersions') {
    group = 'Publishing'
    dependsOn ':global:packageAllVersions'
}
