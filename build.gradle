plugins {
    id 'idea'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.2'
}

allprojects {
    repositories {
        maven {
            name = "PinkCatsLocal"
            url = uri("C:/F/Maven")
        }
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

def publishableProjectPaths = subprojects
        .findAll { project -> project.name ==~ /^(fabric|forge|neoforge)-.*/ }
        .collect { project -> project.path }

tasks.register('publishInfoAllVersions') {
    group = 'Publishing'
    dependsOn publishableProjectPaths.collect { projectPath -> "${projectPath}:PublishInfo" }
}

tasks.register('publishAllVersions') {
    group = 'Publishing'
    dependsOn publishableProjectPaths.collect { projectPath -> "${projectPath}:publishAll" }
}
