plugins {
    id 'idea'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.2'
    id 'fabric-loom' version '1.10.5' apply false
}

def cscFabricMavenMirrorUrl = providers.gradleProperty('csc_fabric_maven_mirror_url')
        .orElse(providers.environmentVariable('CSC_FABRIC_MAVEN_MIRROR_URL'))
        .orNull

allprojects {
    repositories {
        if (cscFabricMavenMirrorUrl != null && !cscFabricMavenMirrorUrl.isBlank()) {
            maven {
                name = 'CSC Fabric Maven Mirror'
                url = uri(cscFabricMavenMirrorUrl)
                allowInsecureProtocol = cscFabricMavenMirrorUrl.startsWith('http://')
                content {
                    // The local Fabric proxy is a fallback for the old Sponge Mixin
                    // artifact only. Routing entire groups here hides newer artifacts
                    // that the proxy has not mirrored yet.
                    includeModule 'net.fabricmc', 'sponge-mixin'
                }
            }
        }
        maven {
            name = "PinkCatsMaven"
            url = uri("https://logistics.aisaveworld.tech/d/share/maven/torque")
            content {
                includeGroup "com.pinkcats.torque"
            }
        }
        mavenCentral()
        maven {
            name = "ModMavenFlywheel"
            url = uri("https://modmaven.dev/")
            content {
                includeGroup "com.jozufozu.flywheel"
            }
        }
    }

    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

apply from: rootProject.file('gradle/allwork/root.gradle')
apply from: rootProject.file('gradle/csc-discord-publishing.gradle')

tasks.register('runClientAllVersions') {
    group = 'Development'
    description = 'Run the client development environment for all runnable versions.'
    dependsOn ':global:runClientAllVersions'
}

tasks.register('runServerAllVersions') {
    group = 'Development'
    description = 'Run the server development environment for all runnable versions.'
    dependsOn ':global:runServerAllVersions'
}
