buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java'
    id 'idea'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

File findSharedRootDir(File startDir) {
    File current = startDir
    while (current != null) {
        if (new File(current, 'gradle/csc-common.properties').exists()) {
            return current
        }
        current = current.parentFile
    }
    throw new GradleException("Unable to locate shared project root for '${project.projectDir}'")
}

File sharedRootDir = findSharedRootDir(project.projectDir)
File commonJavaDir = new File(sharedRootDir, 'common/src/main/java')
File commonResourcesDir = new File(sharedRootDir, 'common/src/main/resources')
File compatCommonJavaDir = new File(project.projectDir, 'src/compatCommon/java')
File specialSourceJar = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/maven_downloader/net/md-5/SpecialSource/1.11.0/SpecialSource-1.11.0-shaded.jar')
File srgToSnapshotMappings = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/minecraft_user_repo/de/oceanlabs/mcp/mcp_config/1.14.4-20190829.143755/srg_to_snapshot_20200119-1.14.3.tsrg')
File mappedForgeJar = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/minecraft_user_repo/net/minecraftforge/forge/1.14.4-28.2.3_mapped_snapshot_20200119-1.14.3/forge-1.14.4-28.2.3_mapped_snapshot_20200119-1.14.3.jar')
File remappedCreateJar = new File(buildDir, "remapped-libs/create-${create_file_id}-mcp.jar")

List<String> compatCommonOverrides = [
        'com/Pink_Cats/createschematicchecker/CscLifecycle.java',
        'com/Pink_Cats/createschematicchecker/FancyConfig/ConfigRegister.java',
        'com/Pink_Cats/createschematicchecker/FancyConfig/SimpleTomlEditor.java',
        'com/Pink_Cats/createschematicchecker/core/BlueCore.java',
        'com/Pink_Cats/createschematicchecker/core/BlueEngine/BlockSweeper.java',
        'com/Pink_Cats/createschematicchecker/core/BlueEngine/NbtFunc.java',
        'com/Pink_Cats/createschematicchecker/core/run.java',
        'com/Pink_Cats/createschematicchecker/lang/CSCLanguage.java',
        'com/Pink_Cats/createschematicchecker/online/OnlineInterface.java',
        'com/Pink_Cats/createschematicchecker/online/VersionChecker.java'
]

def commonJavaTree = fileTree(commonJavaDir) {
    exclude compatCommonOverrides
}

apply from: new File(sharedRootDir, 'gradle/csc-property-loader.gradle')

ext.csc_publish_artifact_task_name = 'reobfJar'
ext.csc_publish_artifact_relative_path = 'build/reobfJar/output.jar'
ext.csc_publish_loader_id = 'forge'
ext.csc_publish_curseforge_loaders = ['Forge']
ext.csc_publish_modrinth_loaders = ['forge']

group = mod_group_id
version = mod_version
archivesBaseName = mod_id

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

configurations {
    createRemapSource
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
    }
    maven {
        name = 'PinkCatsMaven'
        url = uri(project.findProperty('pinkcats_maven_url') ?: 'https://logistics.aisaveworld.tech/d/share/maven/torque')
        if (org.gradle.util.GradleVersion.current() >= org.gradle.util.GradleVersion.version('5.1')) {
            content {
                includeGroup 'com.pinkcats.torque'
            }
        }
    }
}

minecraft {
    mappings channel: 'snapshot', version: '20200119-1.14.3'

    if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'fml.earlyprogresswindow', 'false'
            property 'mixin.debug.export', 'true'
            property 'mixin.debug.verbose', 'true'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.console.level', 'info'
            property 'fml.earlyprogresswindow', 'false'
            property 'mixin.debug.export', 'true'
            property 'mixin.debug.verbose', 'true'
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("com.pinkcats.torque:TorqueAPI-1.14.4-forge:${torque_api_version}") {
        changing = true
        transitive = false
    }
    createRemapSource "curse.maven:create-328085:${create_file_id}"

    compileOnly 'org.jetbrains:annotations:22.0.0'
    compileOnly 'org.spongepowered:mixin:0.8.4'
    implementation files(remappedCreateJar)

    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
}

sourceSets {
    main {
        java {
            setSrcDirs(['src/main/java', compatCommonJavaDir])
        }
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

ext.csc_torque_embed_notation = "com.pinkcats.torque:TorqueAPI-1.14.4-forge:${torque_api_version}"
apply from: new File(sharedRootDir, 'gradle/csc-torque-embed-legacy.gradle')

def templatedResourceProperties = [
        minecraft_version      : project.findProperty('minecraft_version') ?: '',
        minecraft_version_range: project.findProperty('minecraft_version_range') ?: '',
        forge_version          : project.findProperty('forge_version') ?: '',
        forge_version_range    : project.findProperty('forge_version_range') ?: '',
        loader_version_range   : project.findProperty('loader_version_range') ?: '',
        torque_api_version_range: "[${torque_api_version},)",
        mod_id                 : project.findProperty('mod_id') ?: '',
        mod_name               : project.findProperty('mod_name') ?: '',
        mod_license            : project.findProperty('mod_license') ?: '',
        mod_version            : project.findProperty('mod_version') ?: '',
        csc_version            : project.findProperty('mod_version_base') ?: ((project.findProperty('mod_version') ?: '').toString().split('-', 2)[0]),
        mod_authors            : project.findProperty('mod_authors') ?: '',
        mod_description        : project.findProperty('mod_description') ?: '',
        file                   : [jarVersion: project.version.toString()]
]
def generatedTemplatedResourcesDir = layout.buildDirectory.dir('generated/csc-template-resources')
sourceSets.main.resources.exclude 'META-INF/mods.toml', 'pack.mcmeta'

tasks.register('generateTemplatedResources') {
    def templateSources = [
            [path: 'META-INF/mods.toml', file: file('src/main/resources/META-INF/mods.toml')],
            [path: 'pack.mcmeta', file: file('src/main/resources/pack.mcmeta')],
            [path: 'createschematicchecker-build.properties', file: new File(commonResourcesDir, 'createschematicchecker-build.properties')]
    ]

    inputs.files(templateSources.collect { it.file })
    inputs.properties(templatedResourceProperties)
    outputs.dir(generatedTemplatedResourcesDir)

    doLast {
        def engine = new groovy.text.SimpleTemplateEngine()
        templateSources.each { template ->
            if (template.file.exists()) {
                def outputFile = new File(generatedTemplatedResourcesDir.get().asFile, template.path)
                outputFile.parentFile.mkdirs()
                outputFile.setText(engine.createTemplate(template.file.getText('UTF-8')).make(templatedResourceProperties).toString(), 'UTF-8')
            }
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(commonResourcesDir) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        exclude 'createschematicchecker-build.properties'
    }

    dependsOn tasks.named('generateTemplatedResources')
    from(generatedTemplatedResourcesDir)
}

compileJava {
    source commonJavaTree
    options.encoding = 'UTF-8'
    options.compilerArgs = ['-Xdiags:verbose']
}

tasks.register('remapCreateToMcp', Exec) {
    group = 'Build Setup'
    description = 'Remap the 1.14.4 Create dependency from SRG names to the MCP snapshot used by the FG3 dev runtime.'
    inputs.files(configurations.createRemapSource)
    inputs.file(srgToSnapshotMappings)
    outputs.file(remappedCreateJar)

    doFirst {
        if (!specialSourceJar.exists()) {
            throw new GradleException("SpecialSource is missing at '${specialSourceJar}'")
        }
        if (!srgToSnapshotMappings.exists()) {
            throw new GradleException("SRG-to-snapshot mappings are missing at '${srgToSnapshotMappings}'")
        }
        if (!mappedForgeJar.exists()) {
            throw new GradleException("Mapped Forge dev jar is missing at '${mappedForgeJar}'")
        }
        remappedCreateJar.parentFile.mkdirs()
        commandLine(
                System.getProperty('java.home') + File.separator + 'bin' + File.separator + 'java',
                '-cp',
                "${specialSourceJar.absolutePath}${File.pathSeparator}${mappedForgeJar.absolutePath}",
                'net.md_5.specialsource.SpecialSource',
                '--live',
                '--in-jar',
                configurations.createRemapSource.singleFile.absolutePath,
                '--out-jar',
                remappedCreateJar.absolutePath,
                '--srg-in',
                srgToSnapshotMappings.absolutePath
        )
    }
}

tasks.matching { it.name in ['compileJava', 'prepareRuns', 'prepareRunClient', 'prepareRunServer', 'runClient', 'runServer'] }.configureEach {
    dependsOn 'remapCreateToMcp'
}

jar {
    archiveName = "${package_name}-${mod_version}-forge-${minecraft_version}.jar"

    from(new File(sharedRootDir, 'LICENSE.txt')) {
        rename { "${it}_${mod_id}" }
    }

    manifest.attributes([
            'MixinConfigs': 'createschematicchecker.mixins.json'
    ])

    finalizedBy 'reobfJar'
}

ext.csc_allwork_publish_info_message = 'FG3 runner build: publishing metadata is only available from the repository root build.'
apply from: new File(sharedRootDir, 'gradle/allwork/standalone-publishing.gradle')
