plugins {
    id 'base'
    id 'idea'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id 'dev.ithundxr.silk' version '0.11.15'
    id 'me.modmuss50.mod-publish-plugin' version '1.0.0'
}

File findSharedRootDir(File startDir) {
    File current = startDir
    while (current != null) {
        if (new File(current, 'gradle/csc-common.properties').exists()) {
            return current
        }
        current = current.parentFile
    }
    throw new GradleException("Unable to locate shared project root for '${project.projectDir}'")
}

File sharedRootDir = findSharedRootDir(project.projectDir)
File fg3RunnerDir = new File(sharedRootDir, 'gradle-runners/fg3-csc-1.14.4')
File fg3WrapperExecutable = new File(
        fg3RunnerDir,
        System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : 'gradlew'
)

if (!fg3WrapperExecutable.exists()) {
    throw new GradleException("FG3 runner wrapper is missing at '${fg3WrapperExecutable}'")
}

apply from: new File(sharedRootDir, 'gradle/csc-property-loader.gradle')

ext.csc_publish_artifact_task_name = 'reobfJar'
ext.csc_publish_artifact_relative_path = 'build/reobfJar/output.jar'
ext.csc_publish_loader_id = 'forge'
ext.csc_publish_curseforge_loaders = ['Forge']
ext.csc_publish_modrinth_loaders = ['forge']

group = mod_group_id
version = mod_version

String runnerProjectPath = ':forge-1.14.4-0.2.3'

def runnerCommandLineFor = { String taskName ->
    [fg3WrapperExecutable.absolutePath, "${runnerProjectPath}:${taskName}"]
}

def registerRunnerTask = { String taskName, String groupName, String descriptionText, boolean attachStandardInput = false ->
    tasks.register(taskName, Exec) {
        group = groupName
        description = descriptionText
        workingDir = fg3RunnerDir
        if (attachStandardInput) {
            standardInput = System.in
        }
        commandLine(*runnerCommandLineFor(taskName))
    }
}

registerRunnerTask('runClient', 'Development', 'Run the 1.14.4 Forge client through the FG3 runner.', true)
registerRunnerTask('runServer', 'Development', 'Run the 1.14.4 Forge server through the FG3 runner.', true)

tasks.register('reobfJar', Exec) {
    group = 'Build'
    description = 'Build the 1.14.4 Forge distributable jar through the FG3 runner.'
    workingDir = fg3RunnerDir
    commandLine(*runnerCommandLineFor('reobfJar'))
    outputs.file(project.file(csc_publish_artifact_relative_path))
}

tasks.named('assemble').configure {
    dependsOn 'reobfJar'
}

apply from: new File(sharedRootDir, 'gradle/csc-publishing-common.gradle')
