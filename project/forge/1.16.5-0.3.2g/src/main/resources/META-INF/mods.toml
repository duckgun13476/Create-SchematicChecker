modLoader = "javafml" #mandatory
loaderVersion = "${loader_version_range}" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
license = "GNU LGPL 3.0"
[[mods]]
    modId = "${mod_id}" #mandatory
    version = "${mod_version}" #mandatory
    displayName = "${mod_name}" #mandatory
    authors = "Pink_Cats" #optional
    logoFile="icon.png"
    description = '''${mod_description}'''
    displayURL="https://modrinth.com/project/createschematicchecker"

[[dependencies."${mod_id}"]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.16.5,1.17)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="torqueapi"
    mandatory=true
    versionRange="[1.0-SNAPSHOT,)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="create"
    mandatory=true
    versionRange="[v0.3.2g]"
    ordering="NONE"
    side="BOTH"

