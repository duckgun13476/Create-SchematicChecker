import groovy.text.SimpleTemplateEngine

buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'gradle.plugin.com.github.johnrengelman:shadow:7.1.2'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java'
    id 'idea'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'org.spongepowered.mixin'

File findSharedRootDir(File startDir) {
    File current = startDir
    while (current != null) {
        if (new File(current, 'gradle/csc-common.properties').exists()) {
            return current
        }
        current = current.parentFile
    }
    throw new GradleException("Unable to locate shared project root for '${project.projectDir}'")
}

File sharedRootDir = findSharedRootDir(project.projectDir)
boolean standaloneVariantBuild = rootProject.projectDir != sharedRootDir

apply from: new File(sharedRootDir, 'gradle/csc-property-loader.gradle')

ext.csc_publish_artifact_task_name = 'reobfJar'
ext.csc_publish_artifact_relative_path = "build/libs/${package_name}-${mod_version}-forge-${minecraft_version}.jar"
ext.csc_publish_loader_id = 'forge'
ext.csc_publish_curseforge_loaders = ['Forge']
ext.csc_publish_modrinth_loaders = ['forge']

group = mod_group_id
version = mod_version

String gitHash = "${calculateGitHash() + (hasUnstaged() ? '-modified' : '')}"
String archiveBaseName = mod_id

base {
    archivesName = mod_id
}

java {
    withSourcesJar()
    withJavadocJar()
    toolchain.languageVersion = JavaLanguageVersion.of(11)
}

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

configurations {
    legacyNashorn
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenCentral()
    maven { url = 'https://modmaven.dev' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven { url = 'https://maven.blamejared.com' }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.llamalad7.mixinextras'
        }
    }
    maven {
        url = 'https://maven.saps.dev/minecraft'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.ftb.mods'
        }
    }
    maven {
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'PinkCatsLocal'
        url = uri('C:/F/Maven')
    }
    mavenLocal()
}

def relocateLegacyNashorn = tasks.register('relocateLegacyNashorn', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveBaseName = 'legacy-nashorn-compat'
    archiveClassifier = ''
    archiveVersion = '15.4'
    configurations = [project.configurations.legacyNashorn]
    relocate 'org.openjdk.nashorn', 'jdk.nashorn'
}

minecraft {
    mappings channel: 'snapshot', version: '20200514-1.15.1'

    if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        configureEach {
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'info'
            property 'mixin.debug.export', 'true'
            property 'mixin.debug.verbose', 'true'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run')
        }

        server {
            workingDirectory project.file('run/server')
            arg '--nogui'
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').getAbsolutePath(),
                    '--existing', file('src/main/resources').getAbsolutePath()
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("com.pinkcats.torque:TorqueAPI-1.15.2-forge:${torque_api_version}") {
        changing = true
        transitive = false
    }

    implementation 'org.jetbrains:annotations:22.0.0'
    implementation fg.deobf("curse.maven:create-328085:${create_file_id}")
    legacyNashorn 'org.openjdk.nashorn:nashorn-core:15.4'
    runtimeOnly files(tasks.named('relocateLegacyNashorn'))

    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
}

sourceSets.main.java { srcDir new File(sharedRootDir, 'common/src/main/java') }
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.resources { srcDir new File(sharedRootDir, 'common/src/main/resources') }

ext.csc_torque_embed_notation = "com.pinkcats.torque:TorqueAPI-1.15.2-forge:${torque_api_version}"
apply from: new File(sharedRootDir, 'gradle/csc-torque-embed-legacy.gradle')

def templatedResourceProperties = [
        minecraft_version      : project.findProperty('minecraft_version') ?: '',
        minecraft_version_range: project.findProperty('minecraft_version_range') ?: '',
        forge_version          : project.findProperty('forge_version') ?: '',
        forge_version_range    : project.findProperty('forge_version_range') ?: '',
        neo_version            : project.findProperty('neo_version') ?: '',
        neo_version_range      : project.findProperty('neo_version_range') ?: '',
        loader_version_range   : project.findProperty('loader_version_range') ?: '',
        torque_api_version_range: "[${torque_api_version},)",
        mod_id                 : project.findProperty('mod_id') ?: '',
        mod_name               : project.findProperty('mod_name') ?: '',
        mod_license            : project.findProperty('mod_license') ?: '',
        mod_version            : project.findProperty('mod_version') ?: '',
        csc_version            : project.findProperty('mod_version_base') ?: ((project.findProperty('mod_version') ?: '').toString().split('-', 2)[0]),
        mod_authors            : project.findProperty('mod_authors') ?: '',
        mod_description        : project.findProperty('mod_description') ?: '',
        file                   : [jarVersion: project.version.toString()]
]

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.properties(templatedResourceProperties)

    filesMatching('createschematicchecker-build.properties') {
        expand(templatedResourceProperties)
    }

    doLast {
        def outputRoot = destinationDir
        def engine = new SimpleTemplateEngine()

        ['META-INF/mods.toml', 'pack.mcmeta'].each { path ->
            def inputFile = file("src/main/resources/${path}")
            if (inputFile.exists()) {
                def outputFile = new File(outputRoot, path)
                outputFile.parentFile.mkdirs()
                def rendered = engine.createTemplate(inputFile.getText('UTF-8'))
                        .make(templatedResourceProperties)
                        .toString()
                outputFile.setText(rendered, 'UTF-8')
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

def java11Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(11)
}

['runClient', 'runServer', 'runData'].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        javaLauncher = java11Launcher
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
}

compileJava {
    options.compilerArgs = ['-Xdiags:verbose']
}

jar {
    dependsOn relocateLegacyNashorn
    archiveFileName = "${package_name}-${mod_version}-forge-${minecraft_version}.jar"

    from(new File(sharedRootDir, 'LICENSE.txt')) {
        rename { "${it}_${archiveBaseName}" }
    }

    from({
        zipTree(relocateLegacyNashorn.get().archiveFile.get().asFile)
    })

    manifest.attributes([
            'MixinConfigs': 'createschematicchecker.mixins.json',
            'Git-Hash'    : gitHash
    ])

    finalizedBy 'reobfJar'
}

ext.csc_allwork_publish_info_message = 'FG5 runner build: publishing metadata is only available from the repository root build.'
apply from: new File(sharedRootDir, 'gradle/allwork/standalone-publishing.gradle')

String calculateGitHash() {
    try {
        def output = providers.exec {
            commandLine('git', 'rev-parse', 'HEAD')
        }
        return output.standardOutput.asText.get().trim()
    } catch (Throwable ignored) {
        return 'unknown'
    }
}

boolean hasUnstaged() {
    try {
        def output = providers.exec {
            commandLine('git', 'status', '--porcelain')
        }
        String result = output.standardOutput.asText.get().replace('/M gradlew(\\.bat)?/', '').trim()
        if (!result.isEmpty()) {
            println("Found stageable results:\n ${result}\n")
        }
        return !result.isEmpty()
    } catch (Throwable ignored) {
        return false
    }
}
