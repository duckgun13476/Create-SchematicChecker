modLoader = "javafml" #mandatory
loaderVersion = "[40,)" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
license = "GNU LGPL 3.0"
[[mods]]
    modId = "${mod_id}" #mandatory
    version = "${mod_version}" #mandatory
    displayName = "${mod_name}" #mandatory
    authors = "Pink_Cats" #optional
    logoFile="icon.png"
    description = '''${mod_description}'''
    displayURL="https://modrinth.com/project/createschematicchecker"

[[dependencies."${mod_id}"]]
    modId="forge"
    mandatory=true
    versionRange="[40.3.12,)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.18.2,1.19)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="torqueapi"
    mandatory=true
    versionRange="${torque_api_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="create"
    mandatory=true
    versionRange="[0.5.1.b,0.5.2)"
    ordering="NONE"
    side="BOTH"

