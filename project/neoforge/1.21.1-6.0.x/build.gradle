def modMetadataProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             torque_api_version_range: "[${torque_api_version},)",
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]

def generatedModMetadataDir = layout.buildDirectory.dir("generated/sources/modMetadata")

tasks.register("generateModMetadata") {
    inputs.properties(modMetadataProperties)
    inputs.dir("src/main/templates")
    outputs.dir(generatedModMetadataDir)

    doLast {
        def templateRoot = file("src/main/templates")
        def outputRoot = generatedModMetadataDir.get().asFile
        def engine = new SimpleTemplateEngine()

        fileTree(templateRoot).visit { details ->
            if (details.directory) {
                return
            }

            def relativePath = details.relativePath.pathString
            def outputFile = new File(outputRoot, relativePath)
            outputFile.parentFile.mkdirs()

            def rendered = engine.createTemplate(details.file.getText('UTF-8'))
                    .make(modMetadataProperties)
                    .toString()
            outputFile.setText(rendered, 'UTF-8')
        }
    }
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generatedModMetadataDir
tasks.named('processResources').configure {
    dependsOn(tasks.named('generateModMetadata'))
}
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

