import net.darkhax.curseforgegradle.TaskPublishCurseForge

//Copyright@2025 publish method from youkashomecoming


plugins {
    id 'net.neoforged.moddev' version '2.0.107'
    id 'java-library'
    id 'maven-publish'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id "dev.ithundxr.silk" version "0.11.15"
    id "me.modmuss50.mod-publish-plugin" version "1.0.0"
    id "idea"
}

apply from: "./gradle/java.gradle"
apply from: "gradle/property_loader.gradle"
apply from: rootProject.file("gradle/csc-git.gradle")
apply from: rootProject.file("gradle/csc-common.gradle")
apply from: rootProject.file("gradle/csc-publishing-common.gradle")


group = "com.${mod_authors}.${mod_id}"
version = "${minecraft_version}-${mod_version}"
archivesBaseName = mod_id
String gitHash = "${calculateGitHash() + (hasUnstaged() ? "-modified" : "")}"
String configuredMinecraftVersion = providers.gradleProperty("minecraft_version").get()
String configuredModVersion = providers.gradleProperty("mod_version").get()
String cscDisplayVersion = configuredModVersion.split("-", 2)[0]

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {

            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort

    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}


dependencies {
    //implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    //implementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    //compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    //runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    compileOnly("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")
    implementation "curse.maven:copycats-968398:6650033"

    implementation "curse.maven:create-328085:7408951"
    implementation "net.createmod.ponder:ponder-neoforge:1.0.81+mc1.21.1"


    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")


}

tasks.register('syncCSCLanguageVersion') {
    def targetFile = file('src/main/java/com/Pink_Cats/createschematicchecker/lang/CSCLanguage.java')
    inputs.property('minecraftVersion', configuredMinecraftVersion)
    inputs.property('cscVersion', cscDisplayVersion)
    outputs.file(targetFile)

    doLast {
        String content = targetFile.getText('UTF-8')
        content = content.replaceFirst(
                /public static final String mc_version = ".*?";/,
                "public static final String mc_version = \"${configuredMinecraftVersion}\";"
        )
        content = content.replaceFirst(
                /public static final String csc_version = ".*?";/,
                "public static final String csc_version = \"${cscDisplayVersion}\";"
        )
        targetFile.write(content, 'UTF-8')
    }
}

tasks.named('compileJava').configure {
    dependsOn(tasks.named('syncCSCLanguageVersion'))
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.configureEach { task ->
    println "Available task: ${task.name}"
}

tasks.register('PublishInfo') {
    dependsOn(tasks.named('jar'))
    def jarFileProvider = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def modVersionValue = mod_version
    def minecraftVersionValue = minecraft_version
    def displayNameValue = display_name
    doLast {
        println "Reobfuscated JAR file path: ${jarFileProvider.get().asFile.absolutePath}"
        def versionParts = readVersionParts()
        println "version = \"$minecraftVersionValue-$modVersionValue\"\n" +
                "    displayName = \"${displayNameValue}_v${versionParts[0]}_for_Create_v${versionParts[1]}_norforge\""
        def properties = readPublishingProperties()
        if (properties != null) {
            def cfToken = properties.getProperty("CF_TOKEN")
            def modrinthToken = properties.getProperty("MODRINTH_TOKEN")

            println "CF_TOKEN: $cfToken"
            println "MODRINTH_TOKEN: $modrinthToken"
        } else {
            println "api.properties not exist"
        }
    }
    group = 'Publishing'
}

def mod_ids = "createschematicchecker"
jar {
    archiveFileName = "${mod_id}-${mod_version}-neoforge-${minecraft_version}.jar"
    from('LICENSE.txt') {
        rename { "${it}_${mod_ids}" }

    }
    manifest.attributes([
            "MixinConfigs": "createschematicchecker.mixins.json",
            "Git-Hash"    :  gitHash
    ])

}










tasks.register('publishCurseForge', TaskPublishCurseForge) {
    dependsOn 'jar'
    def properties = readPublishingProperties()

    var cfToken = properties?.getProperty("CF_TOKEN")
    apiToken = cfToken
    def versionParts = readVersionParts()

    def mainFile = upload(curseforge_id, new File("./build/libs/${mod_id}-${mod_version}-neoforge-${minecraft_version}.jar"))
    mainFile.changelog = readPrimaryChangelog()
    mainFile.addEnvironment("Client", "Server")
    mainFile.addGameVersion("${minecraft_version}")
    mainFile.addModLoader("NeoForge")
    mainFile.addRequirement("create")


    mainFile.displayName = "${display_name}_v${versionParts[0]}_for_Create_v${versionParts[1]}_neoforge"

    mainFile.addOptional(
            "jei",
            "observable")
    mainFile.releaseType = publish_version //beta release. is alpha.
    disableVersionDetection()
}




publishMods {
    def properties = readPublishingProperties()
    def modrinthTokenGet = properties?.getProperty("MODRINTH_TOKEN")
    def versionParts = readVersionParts()

    file = jar.archiveFile
    changelog = readFullChangelog()
    type = STABLE
    version = "$minecraft_version-$mod_version"
    displayName = "${display_name}_v${versionParts[0]}_for_Create_v${versionParts[1]}_neoforge"

    modLoaders.add("neoforge")

    var mrToken = modrinthTokenGet
    if(mrToken != null) {
        modrinth {
            accessToken = mrToken
            projectId = "${modrinth_id}"
            minecraftVersions.add(minecraft_version)
            requires("create")
            optional("jei","observable")
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

