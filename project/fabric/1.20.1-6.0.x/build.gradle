plugins {
    id 'fabric-loom'
    id 'maven-publish'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id "me.modmuss50.mod-publish-plugin" version "1.0.0"
    id 'idea'
}

apply from: rootProject.file("gradle/csc-property-loader.gradle")
apply from: "./gradle/java.gradle"
apply from: rootProject.file("gradle/csc-git.gradle")
apply from: rootProject.file("gradle/csc-common.gradle")

ext.csc_publish_artifact_task_name = 'remapJar'
ext.csc_publish_artifact_relative_path = "build/libs/${package_name}-${mod_version}-fabric-${minecraft_version}.jar"
ext.csc_publish_loader_id = 'fabric'
ext.csc_publish_curseforge_loaders = ['Fabric', 'Quilt']
ext.csc_publish_modrinth_loaders = ['fabric', 'quilt']

group = mod_group_id
version = mod_version

String gitHash = "${calculateGitHash() + (hasUnstaged() ? "-modified" : "")}"

def pinkcatsMavenRoot = file(project.findProperty('pinkcats_maven_root') ?: 'C:/F/Maven')
def createFabricRepository = project.findProperty('create_fabric_repo')?.toString()?.trim()
def createFabricGroup = project.findProperty('create_fabric_group')?.toString()?.trim() ?: "com.simibubi.create"
def createFabricArtifactId = project.findProperty('create_fabric_artifact_id')?.toString()?.trim() ?: "create-fabric"
def portingLibVersion = project.findProperty('porting_lib_version')?.toString()?.trim()
def registrateFabricVersion = project.findProperty('registrate_fabric_version')?.toString()?.trim()
def flywheelFabricVersion = project.findProperty('flywheel_fabric_version')?.toString()?.trim()
def ponderFabricVersion = project.findProperty('ponder_fabric_version')?.toString()?.trim()
def forgeConfigApiPortFabricVersion = project.findProperty('forgeconfigapiport_fabric_version')?.toString()?.trim()
def nightConfigVersion = project.findProperty('night_config_version')?.toString()?.trim()
def reachEntityAttributesVersion = project.findProperty('reach_entity_attributes_version')?.toString()?.trim()
def milkLibVersion = project.findProperty('milk_lib_version')?.toString()?.trim()
def generatedResourcesDir = file('src/generated/resources')
def accessWidenerFile = file("src/main/resources/${mod_id}.accesswidener")

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    mavenLocal()
    maven {
        name = 'PinkCatsLocal'
        url = uri(pinkcatsMavenRoot)
    }
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.parchmentmc.org/' }
    maven { url = 'https://mvn.devos.one/releases/' }
    maven { url = 'https://mvn.devos.one/snapshots/' }
    maven { url = 'https://maven.createmod.net/' }
    maven { url = 'https://maven.tterrag.com/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.jamieswhiteshirt.com/libs-release/' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }

    if (createFabricRepository) {
        maven {
            name = 'CreateFabricLocal'
            url = uri(createFabricRepository)
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modImplementation("com.pinkcats.torque:TorqueAPI-1.20.1-fabric:${torque_api_version}") {
        changing = true
    }
    include("com.pinkcats.torque:TorqueAPI-1.20.1-fabric:${torque_api_version}")

    modImplementation("${createFabricGroup}:${createFabricArtifactId}:${create_fabric_version}") {
        changing = true
        exclude group: 'net.fabricmc.fabric-api'
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    if (portingLibVersion) {
        [
                'accessors',
                'base',
                'brewing',
                'client_events',
                'entity',
                'extensions',
                'model_generators',
                'models',
                'networking',
                'obj_loader',
                'tags',
                'tool_actions',
                'transfer'
        ].each { portingLibModule ->
            modImplementation("io.github.fabricators_of_create.Porting-Lib:${portingLibModule}:${portingLibVersion}") {
                exclude group: 'net.fabricmc.fabric-api'
                exclude group: 'net.fabricmc', module: 'fabric-loader'
            }
        }
    }

    if (registrateFabricVersion) {
        modImplementation("com.tterrag.registrate_fabric:Registrate:${registrateFabricVersion}") {
            exclude group: 'io.github.fabricators_of_create.Porting-Lib'
            exclude group: 'net.fabricmc.fabric-api'
            exclude group: 'net.fabricmc', module: 'fabric-loader'
        }
    }

    if (flywheelFabricVersion) {
        modImplementation("dev.engine-room.flywheel:flywheel-fabric-${minecraft_version}:${flywheelFabricVersion}") {
            exclude group: 'net.fabricmc.fabric-api'
            exclude group: 'net.fabricmc', module: 'fabric-loader'
        }
    }

    if (ponderFabricVersion) {
        modImplementation("net.createmod.ponder:Ponder-Fabric-${minecraft_version}:${ponderFabricVersion}") {
            exclude group: 'net.fabricmc.fabric-api'
            exclude group: 'net.fabricmc', module: 'fabric-loader'
        }
    }

    if (forgeConfigApiPortFabricVersion) {
        modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeConfigApiPortFabricVersion}") {
            exclude group: 'net.fabricmc.fabric-api'
            exclude group: 'net.fabricmc', module: 'fabric-loader'
        }
    }

    if (nightConfigVersion) {
        implementation("com.electronwill.night-config:core:${nightConfigVersion}")
        implementation("com.electronwill.night-config:toml:${nightConfigVersion}")
    }

    if (reachEntityAttributesVersion) {
        modImplementation("com.jamieswhiteshirt:reach-entity-attributes:${reachEntityAttributesVersion}") {
            exclude group: 'net.fabricmc.fabric-api'
            exclude group: 'net.fabricmc', module: 'fabric-loader'
        }
    }

    if (milkLibVersion) {
        modImplementation("io.github.tropheusj:milk-lib:${milkLibVersion}") {
            exclude group: 'net.fabricmc.fabric-api'
            exclude group: 'net.fabricmc', module: 'fabric-loader'
        }
    }

    if ((project.findProperty('modmenu_runtime_enabled') ?: 'false').toBoolean()) {
        modLocalRuntime("com.terraformersmc:modmenu:${modmenu_version}")
    }
}

if (generatedResourcesDir.exists()) {
    sourceSets.main.resources.srcDir generatedResourcesDir
}

loom {
    if (accessWidenerFile.exists()) {
        accessWidenerPath = accessWidenerFile
    }

    runs {
        client {
            client()
            runDir = 'run'
        }

        server {
            server()
            runDir = 'run/server'
        }
    }
}

def templatedFabricResourceProperties = [
        version             : project.version.toString(),
        mod_id              : project.findProperty('mod_id') ?: '',
        mod_version         : project.version.toString(),
        mod_name            : project.findProperty('mod_name') ?: '',
        mod_description     : project.findProperty('mod_description') ?: '',
        mod_authors         : project.findProperty('mod_authors') ?: '',
        mod_license         : project.findProperty('mod_license') ?: '',
        minecraft_version   : project.findProperty('minecraft_version') ?: '',
        loader_version      : project.findProperty('loader_version') ?: '',
        fabric_api_version  : project.findProperty('fabric_api_version') ?: '',
        mixin_refmap        : "${project.name}-refmap.json"
]
def generatedFabricResourcesDir = layout.buildDirectory.dir('generated/fabric-template-resources')
sourceSets.main.resources.exclude 'fabric.mod.json', 'createschematicchecker.mixins.json'

tasks.register('generateFabricTemplateResources') {
    inputs.properties(templatedFabricResourceProperties)
    inputs.files(fileTree('src/main/resources') {
        include 'fabric.mod.json', 'createschematicchecker.mixins.json'
    })
    outputs.dir(generatedFabricResourcesDir)

    doLast {
        def engine = new groovy.text.SimpleTemplateEngine()
        ['fabric.mod.json', 'createschematicchecker.mixins.json'].each { path ->
            def inputFile = file("src/main/resources/${path}")
            if (inputFile.exists()) {
                def outputFile = new File(generatedFabricResourcesDir.get().asFile, path)
                outputFile.parentFile.mkdirs()
                outputFile.setText(engine.createTemplate(inputFile.getText('UTF-8')).make(templatedFabricResourceProperties).toString(), 'UTF-8')
            }
        }
    }
}

processResources {
    dependsOn tasks.named('generateFabricTemplateResources')
    from(generatedFabricResourcesDir)
}

jar {
    manifest.attributes([
            "MixinConfigs": "createschematicchecker.mixins.json",
            "Git-Hash"    : gitHash
    ])
}

remapJar {
    archiveFileName = "${package_name}-${mod_version}-fabric-${minecraft_version}.jar"
}

apply from: rootProject.file("gradle/allwork/publishing.gradle")

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = "createschematicchecker-fabric-${minecraft_version}"
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
