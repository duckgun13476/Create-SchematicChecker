plugins {
    id 'base'
}

def publishableProjects = rootProject.subprojects.findAll { project ->
    project.name ==~ /^(fabric|forge|neoforge)-.*/
}

def finalArtifactTaskNameFor = { Project targetProject ->
    def configuredTaskName = targetProject.findProperty('csc_publish_artifact_task_name')?.toString()?.trim()
    if (configuredTaskName != null && !configuredTaskName.isEmpty()) {
        return configuredTaskName
    }

    if (targetProject.name.startsWith('fabric-')) {
        return 'remapJar'
    }
    if (targetProject.name.startsWith('forge-')) {
        return 'reobfJar'
    }
    return 'jar'
}

tasks.register('publishInfoAllVersions') {
    group = 'Publishing'
    description = 'Print publish info for all publishable versions.'
    dependsOn publishableProjects.collect { targetProject -> "${targetProject.path}:PublishInfo" }
}

tasks.register('publishAllVersions') {
    group = 'Publishing'
    description = 'Publish all publishable versions.'
    dependsOn publishableProjects.collect { targetProject -> "${targetProject.path}:publishAll" }
}

tasks.register('packageAllVersions') {
    group = 'Publishing'
    description = 'Build final distributable jars for all publishable versions.'
    dependsOn publishableProjects.collect { targetProject ->
        "${targetProject.path}:${finalArtifactTaskNameFor(targetProject)}"
    }
}
